[package]
name = "cognifly-aplikacja"
version = "0.1.0"
description = "CogniFly desktop app (menu bar, notifications, inbox)"
edition = "2021"
publish = false

[lib]
name = "cognifly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
keyring = "4"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
