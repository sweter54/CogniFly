<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CogniFly — logowanie</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Logowanie</h1>
      <form id="email-form" novalidate>
        <label>E-mail <input name="email" type="email" autocomplete="email" required /></label>
        <button type="submit">Wyślij kod</button>
      </form>
      <form id="code-form" novalidate hidden>
        <p>Wysłaliśmy kod na <strong id="email-shown"></strong>. Sprawdź też folder spam.</p>
        <label>Kod z maila <input name="code" inputmode="numeric" autocomplete="one-time-code" required /></label>
        <div class="actions">
          <button type="button" id="back" class="secondary">Inny e-mail</button>
          <button type="submit">Zaloguj</button>
        </div>
      </form>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/src/windows/login.ts"></script>
  </body>
</html>
