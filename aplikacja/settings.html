<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CogniFly — ustawienia</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Ustawienia</h1>
      <form id="form" novalidate>
        <label>Adres API <input name="apiUrl" type="url" required /></label>
        <label>Klient Cognito <input name="clientId" required /></label>
        <label>Region <input name="region" required /></label>
        <label>Firma <input name="company" /></label>
        <p id="status" role="status"></p>
        <div class="actions">
          <button type="button" id="defaults" class="secondary">Przywróć domyślne</button>
          <button type="submit">Zapisz</button>
        </div>
      </form>
    </main>
    <script type="module" src="/src/windows/settings.ts"></script>
  </body>
</html>
